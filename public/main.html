<body>
  <header>
    <h1>
      Reaction Speed Test <span class="authorBy">By Richard Newman</span>
    </h1>
  </header>
  <main>
    <div class="buttonBox">
      <button type="button" id="reactBtn" class="idle">Enter your name first!</button>
    </div>
    <div class="nonReactInputs">
      <form onsubmit="event.preventDefault()">
        <div class="nameAndReset">
          <input type="text" id="yourname" placeholder="Name (Required)" autocomplete="off">
          <button type="button" id="resetBtn">Reset All Data</button>
          <button type="button" id="resetBtnSure" class="resetBtnSure" hidden>Are you sure?</button>
        </div>
        <div class="currentUserLogout">
          <button type="button" class="currentUserLogoutBtn secondary">Logout </button>
        </div>
        <br>
        <div class="dataList">

          <ul id="timeList" aria-label="List of the all reaction times">
          </ul>
          <ul id="avgList" aria-label="List of averages among all reaction times">
          </ul>
        </div>
      </form>

    </div>

  </main>

</body>

</html>
