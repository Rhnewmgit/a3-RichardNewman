<body>
  <header>
    <h1>
      Reaction Speed Test <span class="authorBy">By Richard Newman</span>

    <div class="buttonBox">
      <button type="button" id="reactBtn" class="noName">Enter your name first!</button>

      <form onsubmit="event.preventDefault()">
        <div class="nameAndReset">
          <input type="text" id="yourname" placeholder="Name (Required)" autocomplete="off">

          <button type="button" id="resetBtnSure" hidden="true">Are you sure?</button>
        </div>
        <br>
        <br>
        <div class="dataList">

          <ul id="timeList">
          </ul>
          <ul id="avgList">
          </ul>
        </div>
      </form>

    </div>

  </main>
